[workspace]

[package]
name = "onion-enrollment-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bls12-381 = { version = "0.4", features = ["std"] }
ark-ed-on-bls12-381 = { version = "0.4", features = ["r1cs"] }
ark-curve25519 = "0.4"
ark-ec = { version = "0.4", features = ["std", "parallel"] }
ark-ff = { version = "0.4", features = ["std", "parallel", "asm"] }
ark-std = { version = "0.4", features = ["std", "parallel"] }
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-snark = "0.4"
ark-groth16 = { version = "0.4", default-features = false, features = ["parallel"] }
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "crh", "snark", "parallel"] }
ark-serialize = "0.4"
rayon = "1"

# Off-circuit reference math
sha3 = "0.10"
sha2 = "0.10"
curve25519-dalek = { version = "4", features = ["digest"] }
data-encoding = "2.6"
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "onion-enrollment-poc"
path = "src/main.rs"
