name: integration
on:
  pull_request:
    # Don't run Rust tests if only docs changed.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      # integration tests don't exercise the web frontend
      - frontend/**
  # Also support ad-hoc calls for workflow.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # n.b. default runner "ubuntu-latest" may be under-sized
    runs-on: ubuntu-latest
    # The suite runs in ~16 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: setup nix
        uses: freedomofpress/actionslib/act/setup-nix@main

      # debugging step, to confirm that we have a working devshell
      - name: invoke the nix dev shell
        run: nix develop --command echo hello

      - name: run the integration test suite
        run: nix develop --command just integration

      # The harness retains every node's logs under `.tmpXXXXXX` dirs, hence
      # the leading dot in the glob and `include-hidden-files`.
      - name: collect node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-logs
          path: |
            /tmp/**/.tmp*/**/felidae.log
            /tmp/**/.tmp*/**/cometbft.log
            /tmp/**/.tmp*/**/oracle.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
